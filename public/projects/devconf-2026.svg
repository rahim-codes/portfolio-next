<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.05" fill="none"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <circle cx="1120" cy="160" r="230" fill="url(#accent)" opacity="0.08"/>
  <g transform="translate(500 280)">
    <rect width="280" height="230" rx="16" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <rect x="30" y="34" width="120" height="18" rx="9" fill="url(#accent)"/>
    <rect x="30" y="74" width="220" height="10" rx="5" fill="#94a3b8" opacity="0.5"/>
    <rect x="30" y="98" width="190" height="10" rx="5" fill="#94a3b8" opacity="0.35"/>
    <rect x="30" y="140" width="100" height="50" rx="10" fill="url(#accent)" opacity="0.9"/>
    <rect x="150" y="140" width="100" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
  </g>
  <text x="640" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#e2e8f0">DevConf 2026</text>
  <text x="640" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">Conference landing page</text>
</svg>
