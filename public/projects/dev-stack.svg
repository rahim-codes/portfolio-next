<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.05" fill="none"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <circle cx="1100" cy="660" r="240" fill="url(#accent)" opacity="0.08"/>
  <g transform="translate(480 290)">
    <rect width="320" height="210" rx="16" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <rect x="0" y="0" width="320" height="42" rx="16" fill="#1e293b"/>
    <circle cx="26" cy="21" r="6" fill="#f87171"/>
    <circle cx="48" cy="21" r="6" fill="#fbbf24"/>
    <circle cx="70" cy="21" r="6" fill="#34d399"/>
    <text x="30" y="86" font-family="monospace" font-size="18" fill="#a3e635">$ dev-stack</text>
    <text x="30" y="118" font-family="monospace" font-size="18" fill="#94a3b8">  building stack...</text>
    <text x="30" y="150" font-family="monospace" font-size="18" fill="#22d3ee">  ready.</text>
    <rect x="30" y="170" width="12" height="20" fill="#22d3ee"/>
  </g>
  <text x="640" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#e2e8f0">Dev-Stack</text>
  <text x="640" y="616" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">Modern web stack explorer</text>
</svg>
